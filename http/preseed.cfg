# ============================================================================
# cocoro-installer: Preseed Configuration
# ============================================================================
# Debian 13 (Trixie) 完全無人インストール設定
# ターゲット: Intel N95 miniPC (512GB NVMe SSD)
# ============================================================================

# ---------------------------------------------------------------------------
# ロケール & キーボード
# ---------------------------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string JP
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

# ---------------------------------------------------------------------------
# ネットワーク設定
# ---------------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cocoro
d-i netcfg/get_domain string local
d-i netcfg/hostname string cocoro
# DHCP のタイムアウト時にも続行
d-i netcfg/dhcp_timeout string 30
d-i netcfg/dhcpv6_timeout string 10

# ---------------------------------------------------------------------------
# ミラー設定
# ---------------------------------------------------------------------------
d-i mirror/country string JP
# 日本の高速ミラーを直接指定 (deb.debian.org はランダムリダイレクトで遅い場合がある)
d-i mirror/http/hostname string ftp.jp.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

# ---------------------------------------------------------------------------
# 時刻設定
# ---------------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Tokyo
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ntp.nict.jp

# ---------------------------------------------------------------------------
# ユーザー設定
# ---------------------------------------------------------------------------
# root ユーザーを無効化し、管理者ユーザーを作成
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string cocoro Administrator
d-i passwd/username string cocoro-admin
# パスワード（ハッシュ化済み）
# 生成コマンド: echo "cocoro-factory-2026" | mkpasswd -s -m sha-512
d-i passwd/user-password-crypted string $6$pIy1a4P4GCQPTPvv$ECDFn4kShPnAgBmI/UEMd8HUDxVffEWGbBKQl4tV9EeuC8mM9Xr7X30NPvLGjTaQrgjTGZ.5KdBoWemxwC1o50
# sudo グループに追加
d-i passwd/user-default-groups string sudo

# ---------------------------------------------------------------------------
# パーティション設定 (LVM なし, UEFI 対応)
# ---------------------------------------------------------------------------
# 対象ディスクの自動検出 (NVMe or SATA)
# NVMe デバイスを優先し、なければ SATA を使用
d-i partman/early_command string \
  if [ -e /dev/nvme0n1 ]; then \
    echo "/dev/nvme0n1" > /tmp/target_disk; \
  elif [ -e /dev/sda ]; then \
    echo "/dev/sda" > /tmp/target_disk; \
  else \
    echo "/dev/sda" > /tmp/target_disk; \
  fi; \
  debconf-set partman-auto/disk "$(cat /tmp/target_disk)"

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select cocoro-layout

# 確認ダイアログの全スキップ
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman-md/confirm boolean true

# EFI パーティションの強制設定
d-i partman-efi/non_efi_system boolean true

# GPT ディスクラベルを使用
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-basicfilesystems/default_label string gpt
d-i partman/default_label string gpt
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt

# ---------------------------------------------------------------------------
# パーティションレシピ: cocoro-layout
# ---------------------------------------------------------------------------
# /boot/efi:       512MB  (EFI System Partition)
# /       :        50GB   (ext4, Root ファイルシステム)
# /var/lib/docker: 100GB  (ext4, Docker データ)
# /data/cocoro:    残り全容量 (ext4, PostgreSQL/Redis 永続化データ)
# ---------------------------------------------------------------------------
d-i partman-auto/expert_recipe string \
  cocoro-layout :: \
    512 512 512 fat32 \
      $primary{ } \
      $iflabel{ gpt } \
      $reusemethod{ } \
      method{ efi } \
      format{ } \
    . \
    51200 51200 51200 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
      options/relatime{ relatime } \
    . \
    102400 102400 102400 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ /var/lib/docker } \
      options/relatime{ relatime } \
    . \
    1024 1024 -1 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ /data/cocoro } \
      options/relatime{ relatime } \
    .

# ---------------------------------------------------------------------------
# APT 設定
# ---------------------------------------------------------------------------
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates

# ---------------------------------------------------------------------------
# パッケージ選択 (Headless / CLI のみ)
# ---------------------------------------------------------------------------
# GUI は一切インストールしない
# 'standard' タスクは不要なパッケージが多く低速。ssh-server のみ選択。
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string \
  openssh-server \
  curl \
  wget \
  git \
  avahi-daemon \
  network-manager \
  sudo \
  ca-certificates \
  gnupg \
  lsb-release \
  ufw \
  htop \
  vim \
  tmux \
  jq \
  unzip \
  zram-tools

# popularity-contest を無効化
popularity-contest popularity-contest/participate boolean false

# インストール中のアップグレードを無効化 (インストール時間短縮)
# 注意: full-upgrade はインストール中に大量の追加パッケージをDLするため除外
# 初回起動後に手動または firstboot.sh 内で apt upgrade を実行すること
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select none

# ---------------------------------------------------------------------------
# GRUB ブートローダー
# ---------------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
# UEFI 環境のためブートローダーをインストール先に設定
d-i grub-installer/bootdev string default
# GRUB タイムアウトを短く設定 (量産時の高速起動)
d-i debian-installer/add-kernel-opts string quiet net.ifnames=0 biosdevname=0

# ---------------------------------------------------------------------------
# Late Command: Post-Installation 処理
# ---------------------------------------------------------------------------
# 重要: late_command 値の内部に # コメントを記述してはならない。
#       シェル継続行(\)内のコメントは後続コマンドを全てコメントアウトする。
# ---------------------------------------------------------------------------
d-i preseed/late_command string \
  echo "=== cocoro-installer: late_command start ===" > /target/var/log/cocoro-install.log; \
  cp /cdrom/setup.sh /target/tmp/setup.sh 2>/dev/null || true; \
  chmod +x /target/tmp/setup.sh 2>/dev/null || true; \
  echo "cocoro-admin ALL=(ALL:ALL) NOPASSWD: ALL" > /target/etc/sudoers.d/cocoro-admin; \
  chmod 440 /target/etc/sudoers.d/cocoro-admin; \
  sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /target/etc/ssh/sshd_config; \
  sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /target/etc/ssh/sshd_config; \
  mkdir -p /target/etc/avahi; \
  sed -i 's/^#host-name=.*/host-name=cocoro/' /target/etc/avahi/avahi-daemon.conf 2>/dev/null || true; \
  in-target /bin/bash /tmp/setup.sh >>/target/var/log/cocoro-install.log 2>&1; \
  echo "=== cocoro-installer: late_command end ===" >> /target/var/log/cocoro-install.log; \
  cp /var/log/syslog /target/var/log/cocoro-installer-syslog.log 2>/dev/null || true

# ---------------------------------------------------------------------------
# 終了処理: インストール完了後にシャットダウン (USB抜き取り用)
# ---------------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
