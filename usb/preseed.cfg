d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string JP
d-i keyboard-configuration/xkb-keymap select jp
d-i console-setup/ask_detect boolean false
d-i netcfg/choose_interface select auto
d-i mirror/country string JP
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Tokyo
d-i clock-setup/ntp boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/expert_recipe string \
  cocoro-layout :: \
    538 538 1075 free \
      $iflabel{ gpt } \
      $reusemethod{ } \
      method{ efi } \
      format{ } \
    . \
    51200 51200 51200 ext4 \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    102400 102400 102400 ext4 \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /var/lib/docker } \
    . \
    4096 4096 4096 linux-swap \
      method{ swap } format{ } \
    . \
    1024 1024 -1 ext4 \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /data/cocoro } \
    .
d-i partman-auto/choose_recipe select cocoro-layout
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid
d-i passwd/root-login boolean false
d-i passwd/user-fullname string cocoro-admin
d-i passwd/username string cocoro-admin
d-i passwd/user-password-crypted password $6$pIy1a4P4GCQPTPvv$ECDFn4kShPnAgBmI/UEMd8HUDxVffEWGbBKQl4tV9EeuC8mM9Xr7X30NPvLGjTaQrgjTGZ.5KdBoWemxwC1o50
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl wget git ca-certificates gnupg ufw avahi-daemon network-manager htop jq python3-venv zram-tools
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
d-i netcfg/get_hostname string cocoro
d-i netcfg/get_domain string local
d-i preseed/late_command string \
  mkdir -p /target/opt/cocoro; \
  cp /cdrom/cocoro/setup.sh /target/opt/cocoro/setup.sh; \
  cp /cdrom/cocoro/firstboot.sh /target/opt/cocoro/firstboot.sh; \
  cp /cdrom/cocoro/cocoro-firstboot.service /target/etc/systemd/system/cocoro-firstboot.service; \
  chmod +x /target/opt/cocoro/setup.sh; \
  chmod +x /target/opt/cocoro/firstboot.sh; \
  echo "cocoro-admin ALL=(ALL:ALL) NOPASSWD: ALL" > /target/etc/sudoers.d/cocoro-admin; \
  chmod 440 /target/etc/sudoers.d/cocoro-admin; \
  sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /target/etc/ssh/sshd_config; \
  mkdir -p /target/etc/avahi; \
  sed -i 's/^#host-name=.*/host-name=cocoro/' /target/etc/avahi/avahi-daemon.conf 2>/dev/null || true; \
  in-target systemctl enable cocoro-firstboot.service; \
  echo "=== cocoro-installer: preseed complete ===" > /target/var/log/cocoro-install.log
